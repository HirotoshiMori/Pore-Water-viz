[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poreviz"
version = "0.1.0"
description = "間隙水圧計CSVをケース単位で図化する再現性重視の基盤"
readme = "context.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "typer>=0.9",
    "Pillow>=10.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[project.scripts]
poreviz = "poreviz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
