# =============================================================================
# ケース別設定（学生向け）
# =============================================================================
# 【このファイルの意味】
#   この実験だけ base.yaml と違う設定にしたいときに書きます。
#   書いた項目だけ base が上書きされ、書いていない項目は base のままです。
#   ファイルがなくても、base の設定だけでこのケースは実行できます。
#
# 【いつ使うか】
#   - この実験だけ計測器のチャンネルとCSVの列の対応が違うとき
#     → io.channel_mapping のコメントを外して、列番号（0始まり）を書く
#   - この実験だけ DIP 除去（下向きトゲ補正）をかけたいとき
#     → io.pore_dip_removal を追加
#
# 【channel_mapping を書くとき】
#   「チャンネル名（P1, P2, … / L1, L2, …）」と「CSVの列番号（0始まり）」の対応です。
#   ここに書いたチャンネルだけが読み込まれ、グラフにもその系列だけが描画されます。
#   例: P1=8列目 → 7（0始まり）, L1=3列目 → 2
# =============================================================================

io:
  channel_mapping:
    pore:   { P1: 7, P2: 8, P3: 9, P4: 10 }
    laser:  { L1: 2, L2: 3}
