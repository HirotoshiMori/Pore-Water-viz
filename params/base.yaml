# =============================================================================
# base.yaml — 全ケース共通の設定ファイル
# =============================================================================
# このファイルは「データの読み方」「計算の基準」「グラフの見た目」を決めます。
# 個別の実験だけ変えたいときは params/cases/{ケース名}.yaml で上書きできます。
#
# ■ 学生向け：このファイルの見方
#   - 「#」で始まる行はコメント（説明）です。プログラムはここを読みません。
#   - コロン「:」の左が「設定項目の名前」、右が「その値」です。
#   - 値を変えたら、ノートブックや poreviz を再実行すると反映されます。
#   - 意味が分からない項目は、まずそのまま使って大丈夫です。
# =============================================================================

# -----------------------------------------------------------------------------
# project: プロジェクトとフォルダの場所
# -----------------------------------------------------------------------------
# 【意味】図化に使う「データ」「設定」「出力」がどのフォルダにあるかを決めます。
# 【変えるとき】データを別のドライブやフォルダに置いている場合だけ変更します。
project:
  env: "auto"   # 実行環境の自動判定（"local"=PC上 / "colab"=Google Colab）
  paths:         # 各環境でのフォルダパス（通常は変更不要）
    local:       # PCで実行するとき
      root: "."
      data_dir: "./data"      # CSV を置くフォルダ（ここに計測CSVを入れる）
      params_dir: "./params"  # このYAMLが入っているフォルダ
      output_dir: "./output"  # グラフ・ログの出力先（ここに図が保存される）
    colab:       # Google Colab で実行するとき（Drive の作業フォルダを使う場合は root をそのパスに）
      root: "/content/drive/MyDrive/Colab Notebooks/sinkhole_analysis"
      data_dir: "./data"
      params_dir: "./params"
      output_dir: "./output"

# -----------------------------------------------------------------------------
# io: データの読み込みと列の指定
# -----------------------------------------------------------------------------
# 【意味】計測器のCSVを「どこから・どの列を」読むか、および「基準の取り方」を決めます。
# 計測器のCSVは「上の方にヘッダ行がたくさん」「下の方にフッタ」がある形式なので、
# 何行目からデータとして読むかを指定します。
# -----------------------------------------------------------------------------
io:
  # 【意味】CSVファイルの文字コード。計測器の出力は Shift-JIS のことが多いです。
  encoding: "shift-jis"

  # 【意味】CSVの「データ部分」が何行目から何行目までか。
  # ヘッダ行を飛ばし、フッタ行を読まないようにします。
  read_csv:
    # NR-600 の先頭が #BeginHeader,<行数> のときは、この値よりその行数を優先する（ファイルごとにヘッダ長が違うため）。
    skiprows: 69    # マーカーが無いCSVで、先頭何行をヘッダとして飛ばすか
    skipfooter: 7   # 末尾 7 行はフッタなので読まない
    engine: "python"  # skipfooter を使うときは "python" が必要

  # 【意味】data フォルダのうち、どのファイルを「1つの実験（ケース）」として扱うか。
  discover: "*.csv"

  # ★ 列の指定（0始まり: 1列目=0, 2列目=1, …）
  # 【意味】CSVの「何列目が日時・間隙水圧・レーザーか」を合わせます。
  # 計測器の接続やCSVの形式が違う場合は、ここか cases/*.yaml の channel_mapping で合わせます。
  columns:
    datetime: 0           # 日時の列（1列目）
    pore: [7, 8, 9, 10]   # 間隙水圧計 4ch → 8,9,10,11 列目
    laser: [2, 3, 4, 5]  # レーザー距離計 → 3,4,5,6 列目（使う本数は laser_count で指定）

  # 【意味】レーザー距離計を何本分使うか。2 または 4。channel_mapping を書いていないときだけ有効。
  laser_count: 4

  # ★ 基準値の取り方（実験の「ゼロ」をいつにするか）
  # 【意味】「記録開始から何秒後」を「実験の開始」とみなし、その時刻の値を基準（0）にします。
  # グラフの間隙水圧は「その基準時刻を 50mm」として表示されます。
  baseline_seconds: 60
  # 【意味】フィルタをかけたあと、基準時刻の値をきっちり 50mm に合わせてからグラフ・動水勾配を計算するか。
  # true にすると「60秒の値＝50mm」で揃います。false だと従来どおり（合わせない）。
  pore_rebaseline_50mm_after_filter: true

  # 間隙水圧のドリフト補正
  # 【意味】センサーの経時ドリフト（時間とともに少しずつずれること）を打ち消します。
  # "linear_baseline" = 指定区間の直線トレンドをドリフトとみなして差し引く。false で補正なし。
  pore_drift_correction: "linear_baseline"
  # 【意味】ドリフトを推定する区間。「この区間は値が一定」とみなして傾きだけを推定します。
  pore_drift_baseline_start: 0   # 記録開始からこの秒数から
  pore_drift_baseline_seconds: 660  # この長さ（秒）の区間で傾きを推定

  # 間隙水圧のみ: 下向き DIP 除去（Hampel 風・下側だけ）
  # 【意味】計測のたびにたまに現れる「下向きのトゲ（DIP）」だけを補正します。デフォルトは OFF。
  # 有効にするときはケースごとに params/cases/{ケース名}.yaml で指定します。
  # 全チャンネル一括: pore_dip_removal: { window: 11, k: 2 }
  # チャンネル別:     pore_dip_removal: { P1: { window: 11, k: 2 }, P3: { window: 7, k: 2.5 } }
  pore_dip_removal: null

  # ノイズ除去用フィルタ（Median → Savitzky–Golay の順で適用）
  # 【意味】細かいノイズを滑らかにします。階段状のデータでは Median だけ使うことが多いです。
  filters:
    pore:   # 間隙水圧に使うフィルタ
      median_window: 5   # メディアンフィルタの窓幅（点）。大きいほど滑らか、小さくすると細かい変化が残る
      sg_window: 21      # Savitzky–Golay の窓幅。null にすると SG は使わない（段差を保ちたいときは null）
      sg_polyorder: 3    # SG の多項式の次数
    laser:  # レーザー変位に使うフィルタ
      median_window: 5
      sg_window: null
      sg_polyorder: null

  # ★ 動水勾配の計算に使う「測定点間の距離」(m)
  # 【意味】動水勾配 = (間隙水圧の換算値 [m] - 0.05) ÷ 距離 [m] で計算します。
  # P1〜P4 のセンサーが「基準から何 m の位置にあるか」を実験装置に合わせて入れます。
  hydraulic_gradient_lengths:
    P1: 0.005   # 5 mm
    P2: 0.05    # 50 mm
    P3: 0.1     # 100 mm
    P4: 0.2     # 200 mm

# -----------------------------------------------------------------------------
# plot_style: グラフの見た目と軸の範囲
# -----------------------------------------------------------------------------
# 【意味】グラフの「時間の0秒」「軸の範囲」「図のサイズ・フォント・保存形式」を決めます。
plot_style:
  # 【意味】グラフの横軸の「0秒」を、記録開始から何秒後にしますか。
  # 60 にすると、記録開始 60 秒後がグラフの 0 秒になり、実験開始前の様子を切り捨てます。
  time_from_start_seconds: 60

  # 【意味】グラフの軸の表示範囲。指定しないとデータに合わせて自動になります。
  xlim: [0, 3000]   # 横軸: 0 ～ 3000 秒
  ylim: [-0.05, 0.1]  # 縦軸のデフォルト（間隙水圧・レーザーはプログラム側で別途指定）

  # 【意味】図のサイズと解像度。レポートに貼るときは dpi を上げるときれいです。
  figure:
    aspect:
      mode: "ratio"   # 縦横比でサイズを決める
      width_in: 10.0  # 幅（インチ）
      ratio: 0.67     # 高さ/幅（0.67 = 縦が幅の約2/3）
    dpi: 150          # 解像度（大きいほどきれい、ファイルは重くなる）
    constrained_layout: true  # ラベルがはみ出ないようにレイアウトを調整

  # 【意味】グラフの文字サイズ（pt）。タイトル・軸ラベル・目盛り・凡例を個別に指定できます。
  fonts:
    family: "DejaVu Sans"   # 欧文フォールバック
    cjk_family: "auto"      # 日本語（ケース名など）。auto = OS の日本語フォントを自動検出
    title: 28      # タイトル（ケース名など）
    axis_label: 24 # 軸ラベル（「Time (s)」「Pressure head (mm)」など）
    tick_label: 20 # 目盛りの数字
    legend: 16     # 凡例（P1, P2, … の文字）

  # 【意味】図の保存形式。png はそのまま貼り付けやすく、pdf は印刷向きです。
  save:
    format: "png"       # "png" または "pdf" など
    transparent: false # 背景を透明にするか（false=白背景）
